const MD = "\n\n<!-- .slide: data-transition=\"convex\" -->\n\n\n\n## <span style=\"color:red\">AI 應用工程 作品履歷<\/span>\n\n**黃政傑**\n**國立臺北科技大學 機械工程系 機電整合碩士班**\n**Email：huangjie095@gmail.com**\n\n<aside class=\"notes\">您好，我是黃政傑，目前就讀臺北科技大學機電整合碩士班。接下來用幾分鐘，跟您介紹我做過的 AI 應用專案。<\/aside>\n\n\n---\n\n<!-- .slide: data-transition=\"convex\" -->\n\n# OUTLINE\n\n- 關於我\n- 8D 客訴報告 AI Agent（產學合作）\n- Order：地端多模態 AI 設計平台\n- AI 多語語音教學簡報平台（碩士研究）\n- 明新熊：邊緣 AI 語音問答（產學合作）\n- 技能總覽\n\n<aside class=\"notes\">這份作品集分成四個專案：被動元件的 AI 客訴系統、室內設計 AI 平台、我的碩士研究多語語音教學簡報平台，以及邊緣 AI 語音問答機器人，最後是我的技能總覽。<\/aside>\n\n\n---\n\n<!-- .slide: data-transition=\"convex\" -->\n\n# 關於我\n\n<aside class=\"notes\">先簡單介紹我自己。<\/aside>\n\n\n----\n\n<!-- .slide: data-transition=\"convex\" -->\n\n## 關於我\n\n- 國立臺北科技大學 機電整合碩士班，專注把 **AI 落地到真實產業流程**\n- 碩士研究：**地端多語 AI 語音教學簡報平台**\n- 參與 **4 個產學合作**：被動元件客訴、室內設計、PCB / LED 瑕疵檢測、邊緣 AI 語音問答\n- 從**資料盤點 → 架構設計 → 開發部署 → 實測驗證**全程經手，且全部**地端部署**\n\n<aside class=\"notes\">我大學念機械，從高職開始就接觸機械加工，後來在工研院實習做結構模擬。進入碩士班後，我把用電腦解決複雜問題的能力延伸到 AI。我參與了四個產學合作，從整理資料、設計架構，到部署上線都親自經手，而且系統都在企業內部主機運作，資料不會外流。<\/aside>\n\n\n---\n\n<!-- .slide: data-transition=\"convex\" -->\n\n# 8D 客訴報告 AI Agent\n產學合作｜被動元件製造商｜2026/09 – 2027/12\n\n<aside class=\"notes\">第一個專案，是和一家被動元件製造商合作的 AI 客訴系統，從今年九月執行到明年年底。<\/aside>\n\n\n----\n\n<!-- .slide: data-transition=\"convex\" -->\n\n## 問題與目標\n\n- 歷年客訴登錄表、8D 報告（PDF / Word / Excel）與 BPM 系統各自分散 → **資料孤島，只能逐年逐筆點開**\n- 以 **RAG + Agentic Workflow** 打造四大模組：\n  1. 跨系統、跨年度**客訴知識庫**\n  2. **異常單 AI 開立**（語音 / 文字自動擷取料號、不良率、不良現象）\n  3. **8D 報告 D3–D7 自動生成**，同步填寫 BPM 處理單與客訴登錄表\n  4. 介接 ERP / MES 的**客訴追溯分析儀表板**\n- 限制：**全地端部署**、資料不可外流\n\n<aside class=\"notes\">這家公司多年累積的客訴報告，散落在不同格式的檔案和系統裡，要找過去的案例只能一筆一筆翻。我們的目標是建立可以搜尋的知識庫，讓 AI 能參考過去案例，協助開立異常單、撰寫報告。而且整套系統必須在公司內部運作，資料不能外流。<\/aside>\n\n\n----\n\n<!-- .slide: data-transition=\"convex\" -->\n\n## 知識庫建置流程\n\n![8D 知識庫流程](8d_pipeline.png)\n\n<aside class=\"notes\">這是知識庫的建置流程。歷年報告先經過檔名清理，再由工作流程自動切成八個段落並抽出重點，最後寫回知識庫。同一個案子如果有多個版本，系統會自動只保留最新版。<\/aside>\n\n\n----\n\n<!-- .slide: data-transition=\"convex\" -->\n\n## 先解決資料問題\n\n- **問題**：歷年報告檔名格式不一，同一家公司有繁簡中文多種寫法，Word、PDF 重複\n- **做法**：自動解析檔名，建立客戶別名對照表，並統一各家 8D 報告欄位\n- **結果**：公司辨識率 **84%**、自動排除**多組**重複檔\n\n<aside class=\"notes\">在做 AI 之前，我先處理資料品質。歷年報告的檔名格式不一，同一家公司還有繁體、簡體多種寫法，Word 和 PDF 也常常重複。我寫程式自動解析檔名、建立客戶名稱對照表，公司辨識率達到百分之八十四，也自動排除了重複檔案。資料乾淨了，AI 才能發揮作用。<\/aside>\n\n\n----\n\n<!-- .slide: data-transition=\"convex\" -->\n\n## Dify 工作流\n\n- 文件擷取 → 依 D0~D8 切段 → LLM 抽欄位 → **MCP 寫回知識庫**\n- 自動判斷同案版次：舊版另存，主庫只留最新版\n\n<!-- 放：Dify 工作流畫布截圖（注意遮掉客戶名稱） -->\n\n<aside class=\"notes\">這是實際的工作流程畫面。文件上傳後，會自動切段、抽取欄位，再寫回知識庫，整個過程不需要人工介入。<\/aside>\n\n\n---\n\n<!-- .slide: data-transition=\"convex\" -->\n\n# Order：地端多模態 AI 設計平台\n延續學長開發的平台，依室內設計公司需求加入新功能\n\n<aside class=\"notes\">第二個專案，是室內設計公司使用的 AI 平台。這套平台原本由實驗室學長開發，我延續下去，並依照客戶需求加入新功能。<\/aside>\n\n\n----\n\n<!-- .slide: data-transition=\"convex\" -->\n\n## 我的角色\n\n- 這套平台原本由**實驗室學長**開發（碩士論文）\n- 我先把**沒做完的功能和資安問題**處理好\n- 再依**室內設計公司**的需求加入新功能：\n  - 上傳圖片，AI 自動判斷是**室內照片**還是**材質樣本**\n  - 可以**搜尋色卡**與材質\n  - 點選風格標籤，找出**所有同風格圖片**（原本只顯示 5 張）\n  - 多張參考圖**融合成一張新設計圖**\n\n<aside class=\"notes\">我先把原本沒做完的功能和資安問題處理好，再加入四項新功能：上傳圖片時自動判斷是室內照片還是材質樣本、色卡搜尋、依風格標籤找出所有相似圖片，以及把多張參考圖融合成一張新的設計圖。<\/aside>\n\n\n----\n\n<!-- .slide: data-transition=\"convex\" -->\n\n## 系統架構\n\n![Order 系統架構](order_arch.png)\n\n<aside class=\"notes\">這是平台的架構。藍色是原本就有的功能，橘色是我新增或改良的部分。所有模型都部署在學校的 GPU 主機上。<\/aside>\n\n\n----\n\n<!-- .slide: data-transition=\"convex\" -->\n\n## 圖片匯入與資料庫\n\n![圖片匯入](order_import.png)\n\n拖曳資料夾即可批次匯入，**依子資料夾（案場）各自分析**，不會混在一起\n\n<aside class=\"notes\">這是圖片匯入的畫面。設計師只要把整個資料夾拖進來，系統會依照每個案場的子資料夾分別分析，不會混在一起。<\/aside>\n\n\n----\n\n<!-- .slide: data-transition=\"convex\" -->\n\n## 判讀與檢索流程\n\n![圖片判讀與檢索流程](order_image_flow.png)\n\n<aside class=\"notes\">圖片上傳後，AI 會先判斷類型。室內照片會分析空間、風格、家具；材質樣本則分析材質、顏色與紋理。結果存成標籤，之後就能用不同方式搜尋。<\/aside>\n\n\n----\n\n<!-- .slide: data-transition=\"convex\" -->\n\n## 原本：AI 對話檢索\n\n![AI 對話檢索](order_chat_search.png)\n\n輸入 Prompt「幫我找舊款客廳的照片」→ Agent 透過 MCP 呼叫 `search_images` 工具 → 回傳 **5 張**\n\n<aside class=\"notes\">原本的平台，使用者用一句話搜尋，AI 只會回傳五張圖片。<\/aside>\n\n\n----\n\n<!-- .slide: data-transition=\"convex\" -->\n\n## 新增：依標籤延伸瀏覽\n\n![依標籤延伸瀏覽](order_tag_search.png)\n\nAI 自動標籤 → 點「現代簡約」→ 找出 **1139** 張同風格圖片\n\n<aside class=\"notes\">我新增了依標籤延伸瀏覽。點一下「現代簡約」這個標籤，就能找出一千多張同風格的圖片，設計師找靈感方便很多。<\/aside>\n\n\n----\n\n<!-- .slide: data-transition=\"convex\" -->\n\n## 多圖融合設計生成\n\n![多圖融合](order_multiref.png)\n\n<aside class=\"notes\">最後是多圖融合。使用者提供空間照、喜歡的沙發和茶几，系統先用視覺語言模型判斷每張圖是否相關，再交給生成模型融合成新的設計圖。理解和生成分開，以後換更好的模型也不用重做。<\/aside>\n\n\n---\n\n<!-- .slide: data-transition=\"convex\" -->\n\n# AI 多語語音<br>教學簡報平台\n碩士研究\n\n<aside class=\"notes\">第三個是我的碩士研究，AI 多語語音教學簡報平台。<\/aside>\n\n\n----\n\n<!-- .slide: data-transition=\"convex\" -->\n\n## 要解決的問題\n\n- 實驗室原有流程要老師**直接寫 Markdown**，對習慣 PowerPoint 的老師門檻太高\n- 引入 PPTist 圖形化編輯後，新問題出現：\n  - PPTist 是**固定畫布＋絕對座標**，中文翻成英文/德文後**文字變長 → 溢位、重疊**\n  - JSON 混雜座標、樣式與大量 base64，直接丟給 LLM **耗 token、易改壞欄位**\n\n<aside class=\"notes\">實驗室原本的流程，老師要直接寫程式碼來做簡報，門檻太高。改用類似 PowerPoint 的編輯器之後，又遇到新問題：中文翻成英文或德文後文字變長，版面就會跑掉。<\/aside>\n\n\n----\n\n<!-- .slide: data-transition=\"convex\" -->\n\n## 系統整體架構\n\n![系統整體架構](teaching_fig1_arch.png)\n\n<aside class=\"notes\">這是系統整體架構。老師在編輯器製作簡報，後端負責儲存與翻譯，學生端則用網頁播放簡報與語音。<\/aside>\n\n\n----\n\n<!-- .slide: data-transition=\"convex\" -->\n\n## 雙路徑資料流程\n\n<div style=\"display:flex; align-items:center; gap:40px;\">\n<div style=\"flex:0 0 45%;\">\n<img src=\"teaching_fig2_flow.png\" style=\"max-height:560px;\">\n<\/div>\n<div style=\"flex:1; text-align:left; font-size:0.8em;\">\n<p><b>路徑 A：保留原始 JSON<\/b><br>供 PPTist 隨時重新載入編輯<\/p>\n<p><b>路徑 B：抽成 Markdown<\/b><br>依元素座標推導閱讀順序<br>文字與媒體分離<\/p>\n<p><b>翻譯<\/b><br>錯字表 → 系所專有名詞表<br>→ LLM 逐頁平行翻譯<\/p>\n<p><b>播放<\/b><br>Reveal.js 流式排版＋TTS 語音<\/p>\n<\/div>\n<\/div>\n\n<aside class=\"notes\">我的解法是雙路徑：一份保留原始格式，讓老師隨時回來編輯；另一份抽出文字內容，翻譯後用自動排版播放，翻成哪種語言版面都不會亂。<\/aside>\n\n\n----\n\n<!-- .slide: data-transition=\"convex\" -->\n\n## 老師端：PPTist 編輯\n\n![PPTist 編輯介面](teaching_fig3_editor.png)\n\n<aside class=\"notes\">老師端使用的是類似 PowerPoint 的編輯介面，不需要寫程式也能製作教材。<\/aside>\n\n\n----\n\n<!-- .slide: data-transition=\"convex\" -->\n\n## 一鍵匯出 12 種語言\n\n![多語匯出選單](teaching_fig5_export.png)\n\n- 錯字表修正 → 系所專有名詞表 → vLLM 逐頁平行翻譯\n- 圖片、HTML 註解以 placeholder 保護，翻完再還原\n\n<aside class=\"notes\">做好的簡報可以一鍵匯出十二種語言。翻譯前會先修正錯字，再套用各系所的專有名詞表，確保術語翻譯一致。<\/aside>\n\n\n----\n\n<!-- .slide: data-transition=\"convex\" -->\n\n## 學生端：簡報看板\n\n![簡報看板](teaching_fig6_dashboard.png)\n\n- 依科目瀏覽、即時切換語言，語音逐段預取\n\n<aside class=\"notes\">學生可以依科目瀏覽教材，隨時切換語言，並搭配語音講解。<\/aside>\n\n\n----\n\n<!-- .slide: data-transition=\"convex\" -->\n\n## 附加功能：AI PPT 自動產生\n\n![AI PPT 自動產生](teaching_fig7_aippt.png)\n\n輸入主題 → 自動產生大綱並套模板，中英文輸入各自產生對應語系草稿\n\n<aside class=\"notes\">編輯器也內建 AI 自動產生簡報的功能，只要輸入主題，就能產生大綱和投影片草稿。<\/aside>\n\n\n----\n\n<!-- .slide: data-transition=\"convex\" -->\n\n## 技術取捨\n\n| 項目 | 做法 | 理由 |\n|---|---|---|\n| 版面 | 捨棄逐像素還原，改流式排版 | 換取翻譯後版面彈性 |\n| 翻譯 | Ollama 多節點路由 → vLLM | 連續批次，單實例即可併發 |\n| 語音 | VoxCPM 預設、Qwen3-TTS 備選 | 即時性優先，長文本可切換 |\n| 權限 | HMAC token＋後端查系所 | 不信任前端傳入身分 |\n\n<aside class=\"notes\">這頁整理了我在這個專案中做的四個技術取捨，包括版面、翻譯、語音和權限，每個決定都有明確的理由。<\/aside>\n\n\n---\n\n<!-- .slide: data-transition=\"convex\" -->\n\n# 明新熊：邊緣 AI 語音問答\n產學合作｜明新科技大學｜2024 結案\n\n<aside class=\"notes\">第四個專案，是和明新科技大學合作的 AI 語音問答機器人。<\/aside>\n\n\n----\n\n<!-- .slide: data-transition=\"convex\" -->\n\n## 為什麼用雙機？\n\n- **單機瓶頸**：Jetson Orin Nano 只有 8GB\n  - LLM 推論佔滿 GPU 與記憶體，同時跑語音辨識就嚴重延遲\n  - 記憶體接近上限時觸發 OOM Killer，服務無預警崩潰\n- **雙機分工**\n  - Nano 1（感知）：語音輸入輸出（STT・TTS）\n  - Nano 2（思考）：LLM 推論＋ChromaDB 向量檢索\n  - 語音與文字生成非同步處理，降低等待體感\n\n<aside class=\"notes\">我們使用小型 AI 運算裝置 Jetson，但單台只有八 GB 記憶體，同時跑語音辨識和 AI 回答就會當機。所以我把系統拆成兩台：一台負責聽和說，一台負責思考回答，讓系統穩定運作。<\/aside>\n\n\n----\n\n<!-- .slide: data-transition=\"convex\" -->\n\n## 系統架構\n\n![明新熊系統架構](mx_arch.png)\n\n<aside class=\"notes\">這是兩台裝置的分工架構。使用者說話後，第一台轉成文字，交給第二台查資料並產生回答，再由第一台把答案唸出來。<\/aside>\n\n\n----\n\n<!-- .slide: data-transition=\"convex\" -->\n\n## 記憶體配置（各 8GB）\n\n| 節點 | 主要負載 | 用量 |\n|---|---|---|\n| Nano 1（感知） | Whisper STT・前端介面・TTS | STT 1.5 GB＋前端 0.5 GB |\n| Nano 2（思考） | Mistral-7B（GGUF）＋RAG | LLM 4.5 GB＋RAG 1.0 GB |\n| 兩台共同 | 系統環境 | 各 1.5 GB |\n\n拆開後每台都保留餘裕，不再觸發 OOM\n\n<aside class=\"notes\">拆成兩台後，每台都保留了足夠的記憶體空間，不再發生當機。<\/aside>\n\n\n----\n\n<!-- .slide: data-transition=\"convex\" -->\n\n## 問答流程\n\n<div style=\"display:flex; gap:28px; align-items:stretch;\">\n<div style=\"flex:1; display:flex; flex-direction:column;\">\n<pre style=\"background:#1e1e1e; color:#e6e6e6; font-size:0.42em; line-height:1.5; padding:14px 18px; border-radius:8px; text-align:left; white-space:pre; box-shadow:none; width:100%; margin:0; flex:1; box-sizing:border-box;\">[STT] 偵測語言: zh\n[0.00s -> 2.10s]  機械系有哪些特色課程？\n完整轉錄: 機械系有哪些特色課程？\n<span style=\"color:#7ee787\">✔ 轉錄資料成功傳輸至 RAG 服務<\/span><\/pre>\n<p><b>Nano 1（感知）<\/b><br>語音 → 文字 → 送往 Nano 2<\/p>\n<\/div>\n<div style=\"flex:1; display:flex; flex-direction:column;\">\n<pre style=\"background:#1e1e1e; color:#e6e6e6; font-size:0.42em; line-height:1.5; padding:14px 18px; border-radius:8px; text-align:left; white-space:pre; box-shadow:none; width:100%; margin:0; flex:1; box-sizing:border-box;\">--- 接收到 STT 查詢：機械系有哪些特色課程？\n[RAG 檢索結果] top 5\n 1. sec=機械系　特色選修課程…\n 2. sec=機械系　專業實驗室設備…\n明新熊：本系積極網羅新竹科學園區及工研院\n　　　　高階研究人員擔任特色選修課程，\n　　　　兼收產學合一、理論與實務並重之效。\n<span style=\"color:#7ee787\">POST /process_transcript 200 OK<\/span><\/pre>\n<p><b>Nano 2（思考）<\/b><br>檢索相關段落 → LLM 生成回答<\/p>\n<\/div>\n<\/div>\n\n<p style=\"font-size:0.5em; color:#666;\">※ 上方 log 為流程示意（非實測輸出）｜<b>實測數據<\/b>：Whisper 轉錄約 <b>1.2 秒<\/b>（含 VAD）、RAG＋LLM 端到端約 <b>5.7 秒<\/b><\/p>\n\n<aside class=\"notes\">這是一次問答的流程示意。實測結果是，語音轉文字約一點二秒，從檢索到產生回答約五點七秒。<\/aside>\n\n\n---\n\n<!-- .slide: data-transition=\"convex\" -->\n\n# 技能總覽\n\n<aside class=\"notes\">最後是我的技能總覽。<\/aside>\n\n\n----\n\n<!-- .slide: data-transition=\"convex\" -->\n\n## 技能總覽\n\n| 領域 | 技術 |\n|---|---|\n| LLM / Agent | Dify、MCP、RAG、LangGraph、FastAPI SSE |\n| 模型部署 | vLLM、Ollama、ComfyUI、guidellm |\n| 多模態 | Qwen3-VL、Flux.2、Hunyuan3D、OCR、ASR、TTS |\n| 電腦視覺 | OpenCV、MediaPipe、YOLOv8 |\n| 全端 | Python (FastAPI / Flask)、React、Vue、PHP、MariaDB、Qdrant |\n\n<aside class=\"notes\">我的技能涵蓋大型語言模型與 AI Agent、模型部署、多模態、電腦視覺，以及前後端開發，能從頭到尾把 AI 系統做出來。<\/aside>\n\n\n---\n\n<!-- .slide: data-transition=\"convex\" -->\n\n# *感謝您的閱讀*\n\n<aside class=\"notes\">以上是我的作品介紹，謝謝您的觀看，期待有機會進一步交流。<\/aside>\n";
marked.setOptions({ breaks: true });
// 解析 <!-- .slide: ... --> 屬性（沿用 talk.html 的做法）
function extractSlideAttributes(content){
  const attrs = {}; let clean = content;
  const re = /<!--\s*\.slide:\s*([^>]+?)\s*-->/gi; let m;
  while ((m = re.exec(content)) !== null){
    const ap = /([\w-]+)\s*=\s*["']([^"']+)["']/g; let a;
    while ((a = ap.exec(m[1])) !== null) attrs[a[1]] = a[2];
    clean = clean.replace(m[0], '');
  }
  return { attrs, content: clean.trim() };
}
function sectionTag(attrs){ return '<section' + Object.entries(attrs).map(([k,v])=>` ${k}="${v}"`).join('') + '>'; }
function markdownToSlides(md){
  let html = '';
  md.split(/\n\s*\n---\s*\n\s*\n/).forEach(h => {
    const vs = h.split(/\n\s*\n----\s*\n\s*\n/);
    const render = s => { const {attrs, content} = extractSlideAttributes(s); return sectionTag(attrs) + marked.parse(content) + '</section>'; };
    html += vs.length > 1 ? '<section>' + vs.map(render).join('') + '</section>' : render(h);
  });
  return html;
}
document.querySelector('.reveal .slides').innerHTML = markdownToSlides(MD);

// 語音導覽：瀏覽器內建 TTS（Edge 會用 Microsoft 自然語音，例如 HsiaoChen / HsiaoYu）
const TTS = { on:false, voice:null };
function pickVoice(){
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  return vs.find(v => /zh-TW/i.test(v.lang) && /Natural|Online/i.test(v.name))
      || vs.find(v => /zh-TW/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
}
if (window.speechSynthesis){ TTS.voice = pickVoice(); speechSynthesis.onvoiceschanged = () => { TTS.voice = pickVoice(); }; }
function slideText(s){
  const n = s.querySelector('aside.notes'); if (n) return n.textContent;
  const c = s.cloneNode(true);
  c.querySelectorAll('pre, aside, img, svg, table').forEach(e => e.remove());
  return c.textContent.replace(/[→｜|•※]/g, '，').replace(/\s+/g, ' ').trim();
}
function speakSlide(s){
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  if (!TTS.on || !s) return;
  // 依標點分段朗讀，避免長句被瀏覽器截斷
  slideText(s).split(/(?<=[。！？；：，,])/).forEach(t => {
    if (!t.trim()) return;
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'zh-TW'; if (TTS.voice) u.voice = TTS.voice; u.rate = 1.05;
    speechSynthesis.speak(u);
  });
}
function toggleTTS(){
  if (!window.speechSynthesis){ alert('此瀏覽器不支援語音朗讀，建議使用 Microsoft Edge'); return; }
  TTS.on = !TTS.on;
  const i = document.getElementById('tts-icon');
  if (i) i.className = 'fa ' + (TTS.on ? 'fa-volume-high' : 'fa-volume-xmark');
  speakSlide(TTS.on ? Reveal.getCurrentSlide() : null);
}
Reveal.on('slidechanged', e => speakSlide(e.currentSlide));
document.addEventListener('keydown', e => { if ((e.key === 't' || e.key === 'T') && !e.target.closest('select,input,textarea')) toggleTTS(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && window.speechSynthesis) speechSynthesis.cancel(); });
// 時鐘（參考 workshop / talk.html 右上角時間）
const clock = document.getElementById('clock');
const tick = () => { const d = new Date(); clock.textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
tick(); setInterval(tick, 10000);
</script>
